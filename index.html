<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>WESLECO | Eco-Friendly Bamboo & Wooden Tableware Manufacturer</title>

    <!-- 404 跳转路由检测（解决静态部署刷新报 404 问题） -->
    <script>
        (function(){
            var redirect = sessionStorage.redirect;
            delete sessionStorage.redirect;
            if (redirect && redirect !== location.href) {
                history.replaceState(null, null, redirect);
            }
        })();
    </script>

    <!-- Favicon 浏览器标签图标 -->
    <link rel="icon" href="Wesleco-LOGO.ico" type="image/x-icon">
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2e7d32;
            --primary-dark: #1b5e20;
            --accent: #81c784;
            --bg-light: #f4f7f4;
            --text-dark: #2c3e50;
            --text-gray: #666;
            --border-color: #e2e8f0;
            --nav-height: 74px;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: var(--nav-height);
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Poppins', sans-serif; 
        }

        body { 
            color: var(--text-dark); 
            background-color: #fff; 
            line-height: 1.7; 
            overflow-x: hidden; /* 彻底防止手机端横向滚动条 */
            width: 100%;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .container { 
            width: 100%;
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 0 1.5rem;
        }
        
        /* ================= Header & Mobile Nav ================= */
        header { 
            position: fixed; 
            top: 0; 
            left: 0;
            width: 100%; 
            height: var(--nav-height);
            background: rgba(255, 255, 255, 0.98); 
            backdrop-filter: blur(10px); 
            box-shadow: 0 2px 15px rgba(0,0,0,0.05); 
            z-index: 1000; 
        }

        .nav-container { 
            max-width: 1200px; 
            height: 100%;
            margin: 0 auto; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 1.5rem; 
        }

        .logo img { 
            height: 38px; 
            width: auto; 
            display: block; 
        }

        .nav-links { 
            display: flex; 
            gap: 2rem; 
            list-style: none; 
            align-items: center;
        }

        .nav-links a { 
            text-decoration: none; 
            color: var(--text-dark); 
            font-weight: 500; 
            transition: 0.3s; 
            cursor: pointer; 
            font-size: 0.95rem; 
        }

        .nav-links a:hover { color: var(--primary); }

        .btn-header { 
            background: var(--primary); 
            color: #fff; 
            padding: 0.55rem 1.3rem; 
            border-radius: 6px; 
            text-decoration: none; 
            font-weight: 600; 
            transition: 0.3s; 
            cursor: pointer; 
            font-size: 0.9rem; 
            white-space: nowrap;
        }

        .btn-header:hover { 
            background: var(--primary-dark); 
            transform: translateY(-1px); 
        }

        /* 移动端汉堡包按钮 */
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-dark);
            cursor: pointer;
            padding: 0.5rem;
        }

        /* ================= Hero Section ================= */
        .hero { 
            margin-top: var(--nav-height); 
            background: linear-gradient(rgba(0,0,0,0.58), rgba(0,0,0,0.58)), url('hero-bg.jpg') center/cover no-repeat; 
            min-height: calc(100vh - var(--nav-height));
            display: flex; 
            align-items: center; 
            justify-content: center;
            text-align: center; 
            color: #fff; 
            padding: 4rem 1.25rem; 
        }

        .hero-content { max-width: 850px; margin: 0 auto; }

        .hero-badge { 
            display: inline-block; 
            background: rgba(46, 125, 50, 0.9); 
            color: #fff; 
            padding: 0.35rem 1rem; 
            border-radius: 20px; 
            font-size: clamp(0.75rem, 2vw, 0.85rem); 
            font-weight: 600; 
            margin-bottom: 1.2rem; 
            letter-spacing: 1px; 
            text-transform: uppercase; 
        }

        .hero h1 { 
            font-size: clamp(1.8rem, 4.5vw, 3.2rem); 
            font-weight: 700; 
            margin-bottom: 1.2rem; 
            line-height: 1.25; 
        }

        .hero p { 
            font-size: clamp(0.95rem, 2vw, 1.15rem); 
            margin-bottom: 2.2rem; 
            opacity: 0.92; 
            max-width: 750px; 
            margin-left: auto; 
            margin-right: auto; 
        }

        .btn-group { 
            display: flex; 
            gap: 1rem; 
            justify-content: center; 
            flex-wrap: wrap; 
        }

        .btn-primary { 
            background: var(--primary); 
            color: #fff; 
            padding: 0.85rem 1.8rem; 
            border-radius: 6px; 
            text-decoration: none; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.3s; 
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.3); 
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); }

        .btn-whatsapp { 
            background: #25D366; 
            color: #fff; 
            padding: 0.85rem 1.8rem; 
            border-radius: 6px; 
            text-decoration: none; 
            font-weight: 600; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
            gap: 0.6rem; 
            transition: 0.3s; 
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3); 
        }

        .btn-whatsapp:hover { background: #20ba5a; transform: translateY(-2px); }

        /* ================= Core Highlights ================= */
        .features { background: var(--bg-light); padding: 4.5rem 0; }

        .section-header { text-align: center; max-width: 700px; margin: 0 auto 3rem auto; }
        .section-header span { color: var(--primary); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 0.4rem; }
        .section-header h2 { font-size: clamp(1.6rem, 3.5vw, 2.4rem); color: var(--text-dark); font-weight: 700; line-height: 1.3; }

        .grid-4 { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 1.8rem; 
        }

        .feature-card { 
            background: #fff; 
            padding: 2.2rem 1.8rem; 
            border-radius: 12px; 
            text-align: left; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.03); 
            border: 1px solid var(--border-color); 
            transition: 0.3s; 
        }

        .feature-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.08); border-color: var(--accent); }
        .feature-card i { font-size: 2rem; color: var(--primary); margin-bottom: 1.2rem; background: var(--bg-light); padding: 14px; border-radius: 10px; display: inline-block; }
        .feature-card h3 { font-size: 1.15rem; margin-bottom: 0.6rem; font-weight: 600; }
        .feature-card p { color: var(--text-gray); font-size: 0.92rem; }

        /* ================= Customization Section ================= */
        .customization { padding: 4.5rem 0; background: #fff; }
        
        .custom-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 3rem; 
            align-items: center; 
        }

        .custom-content h3 { font-size: clamp(1.5rem, 3vw, 2rem); margin-bottom: 1rem; color: var(--text-dark); }
        .custom-content p { color: var(--text-gray); margin-bottom: 1.5rem; font-size: 0.95rem; }
        .custom-list { list-style: none; margin-bottom: 2rem; }
        .custom-list li { margin-bottom: 0.8rem; display: flex; align-items: center; gap: 0.8rem; font-weight: 500; font-size: 0.95rem; }
        .custom-list li i { color: var(--primary); }
        
        .custom-img-box { 
            background: var(--bg-light); 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid var(--border-color); 
            padding: 1.5rem; 
            text-align: center; 
        }

        .custom-img-box img { 
            width: 100%; 
            height: 280px; 
            object-fit: cover; 
            border-radius: 8px; 
        }

        /* ================= Products ================= */
        .products { padding: 4.5rem 0; background: var(--bg-light); }

        .grid-3 { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 2rem; 
        }

        .product-card { 
            background: #fff; 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            overflow: hidden; 
            transition: 0.3s; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.02); 
            display: flex;
            flex-direction: column;
        }
